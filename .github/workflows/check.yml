name: check

on:
  push:
  pull_request:

# Everything that needs no PowerPoint: project detection, the render folder, cleanup, the CLI.
jobs:
  macos-system-python:
    # Users run the script with the python3 that ships with macOS (3.9), so test with exactly that.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m py_compile skills/office-render/scripts/office_render.py
      - run: /usr/bin/python3 -m unittest discover -s tests -v

  latest-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m py_compile skills/office-render/scripts/office_render.py
      - run: python -m unittest discover -s tests -v
